[project]
name = "awino-harness"
version = "0.6.5"
description = "A.W.I.N.O. agentic workflow orchestrator with a just-in-time knowledge registry and gate ledger"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Luke Awino" }]
keywords = [
    "agent",
    "agentic-engineering",
    "harness",
    "llm",
    "claude",
    "verification",
    "prompt-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Lukematic/agent-smith"
Repository = "https://github.com/Lukematic/agent-smith"
Issues = "https://github.com/Lukematic/agent-smith/issues"
Documentation = "https://github.com/Lukematic/agent-smith/tree/main/docs"

[project.scripts]
awino = "smith.cli:app"
smith = "smith.cli:deprecated_smith_entry"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smith"]

# The knowledge registry, skills, persona, and constitution are not Python, but
# they are what A.W.I.N.O. *is*. A wheel carrying only the CLI installs a tool whose
# knowledge base is missing, so `awino route` and every skill fail immediately.
#
# force-include maps repository paths to package-relative paths, so the data ships
# inside `smith/_bundle/` and `smith.paths` can find it when no git clone exists.
[tool.hatch.build.targets.wheel.force-include]
"AWINO.md" = "smith/_bundle/AWINO.md"
"AGENT_SMITH.md" = "smith/_bundle/AGENT_SMITH.md"
"plugin.json" = "smith/_bundle/plugin.json"
".claude-plugin" = "smith/_bundle/.claude-plugin"
"settings.json" = "smith/_bundle/settings.json"
"bin" = "smith/_bundle/bin"
"knowledge/REGISTRY.yaml" = "smith/_bundle/knowledge/REGISTRY.yaml"
"knowledge/SOURCES.yaml" = "smith/_bundle/knowledge/SOURCES.yaml"
"skills" = "smith/_bundle/skills"
"agents" = "smith/_bundle/agents"
"hooks" = "smith/_bundle/hooks"
"templates" = "smith/_bundle/templates"
"memory/lessons.md" = "smith/_bundle/memory/lessons.md"

[tool.hatch.build.targets.sdist]
# The sdist is the reproducible source of truth, so it carries everything a clone
# would, minus disposable state.
include = [
    "src",
    "tests",
    "skills",
    "agents",
    "hooks",
    "templates",
    "docs",
    "knowledge/REGISTRY.yaml",
    "knowledge/SOURCES.yaml",
    "memory/lessons.md",
    "AWINO.md",
    "AGENT_SMITH.md",
    "README.md",
    "justfile",
    "plugin.json",
    ".claude-plugin",
    "settings.json",
    "bin",
    "install.ps1",
    "install.sh",
    "bootstrap.ps1",
    "bootstrap.sh",
]

# ── ruff: lint and format in one tool ────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RET",      # return consistency
    "PTH",      # use pathlib
    "ARG",      # unused arguments
    "C4",       # comprehensions
    "TID",      # tidy imports
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
# typer declares CLI options via call-in-default; that is its documented API.
"src/smith/cli/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: full-boundary tests that run the real CLI in a subprocess",
]

