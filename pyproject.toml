[project]
name = "agent-smith"
version = "0.3.0"
description = "Agentic-engineering expert and agent factory with a just-in-time knowledge registry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
smith = "smith.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smith"]

# ── ruff: lint and format in one tool ────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RET",      # return consistency
    "PTH",      # use pathlib
    "ARG",      # unused arguments
    "C4",       # comprehensions
    "TID",      # tidy imports
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
# typer declares CLI options via call-in-default; that is its documented API.
"src/smith/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

