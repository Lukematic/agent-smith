# Run every gate on push and pull request.
#
# The same gates the publish workflow runs, so a release never discovers a failure
# for the first time. Cross-platform because the installers and path resolution are
# platform-sensitive: a symlink that works on Linux may need a junction on Windows.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners sometimes place the uv cache on a different mount than the workspace,
  # where hardlinking fails. Copy mode is slower and always works.
  UV_LINK_MODE: copy

jobs:
  gates:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Runner"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Tests
        # Keep the complete output as an artifact. Public check annotations only
        # say "exit code 1"; without the report, a failure cannot be diagnosed
        # from the GitHub UI when job logs require authentication.
        run: uv run pytest -ra --tb=short --junitxml=test-results-${{ matrix.os }}-py${{ matrix.python }}.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results-${{ matrix.os }}-py${{ matrix.python }}.xml

      - name: Print test failures
        if: always()
        run: |
          uv run python -c "
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('test-results-*.xml'):
              tree = ET.parse(f)
              for tc in tree.findall('.//testcase'):
                  for fail in tc.findall('failure') + tc.findall('error'):
                      cname = tc.get('classname', '')
                      mname = tc.get('name', '')
                      text = (fail.text or '').strip()
                      first_line = text.splitlines()[0] if text else 'test failed'
                      print(f'::error title={cname}.{mname}::{first_line}')
                      print(f'=== FAILED: {cname}.{mname} ===\n{text}\n')
          "

      - name: Validate authored artifacts
        run: uv run awino validate skills agents emitted

      - name: Validator selftest
        run: uv run awino validate --selftest

      - name: Project health (diagnostic)
        # Unit tests, lint, artifact validation, and fresh-install behavior are
        # the release gates above. `doctor` also inspects optional machine-local
        # state (installed harnesses, runners, tracker), so it is diagnostic on a
        # clean hosted runner rather than a reason to reject the source tree.
        if: always()
        continue-on-error: true
        run: uv run awino doctor --fast

  install:
    name: Fresh install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Runner"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run the installer, as a new user would
        # The installer is the first thing a recipient touches, so a break here is
        # the most expensive kind: it fails before anyone can use the tool at all.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -File ./install.ps1 -NoLink -NoTools
          else
            chmod +x ./install.sh && ./install.sh --no-link --no-tools
          fi

      - name: Confirm the install is usable
        shell: bash
        run: |
          uv run awino context
          uv run awino route "what is a harness"
          test "$(uv run awino skills --paths | wc -l)" -eq 16
          uv run awino limits --claims

